<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>拍貼機 Photobooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 854px;
      background: url('https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/bg.png') no-repeat center center / cover;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .screen.active {
      display: block;
    }

    .bg-cover {
      background-size: cover;
      background-position: center;
    }

    .full-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 10;
    }

    .overlay-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 30;
    }

    .clickable {
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .clickable:active {
      transform: scale(0.92);
    }

    /* 選單 */
    .frame-row {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: 92%;
    }

    .frame-item {
      width: 18%;
      height: auto;
      transform: scale(0.85);
    }

    /* 按鈕定位 */
    .btn-no { position: absolute; top: 5%; left: 6%; width: 20%; z-index: 20; }
    .btn-yes { position: absolute; bottom: 3%; left: 36%; width: 15%; z-index: 20; }
    .btn-album { position: absolute; top: 25%; left: 8%; width: 38%; z-index: 20; }
    .btn-camera { position: absolute; top: 25%; right: 8%; width: 38%; z-index: 20; }

    /* 拍照畫面：相機影片襯在預覽框層後面 */
    #shot-camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #shot-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 5;
      pointer-events: none;
    }

    #countdown-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 120px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6);
      font-weight: 900;
      z-index: 20;
    }

    /* 完成與下載頁面 */
    #screen-thanks {
      overflow-y: auto;
      background: #121212;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    #screen-thanks.active {
      display: flex;
    }

    .thanks-wrapper {
      position: relative;
      width: 85%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #final-canvas-preview {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .action-buttons {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 20px;
    }

    .action-btn {
      width: 40%;
      cursor: pointer;
    }

    #file-input, #hidden-canvas { display: none; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 閃光燈 -->
  <img id="flashlight" class="overlay-img" style="display:none;" src="" alt="flash">

  <!-- 1. 開場 -->
  <div id="screen-intro" class="screen active">
    <img id="hello-img" class="clickable full-cover" src="" style="display: none;" alt="hello">
  </div>

  <!-- 2. Choose One -->
  <div id="screen-choose" class="screen">
    <img class="clickable full-cover" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Choose_one.png" id="btn-to-menu" alt="choose_one">
  </div>

  <!-- 3. 選單 -->
  <div id="screen-menu" class="screen bg-cover" style="background-image: url('https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/menu.png');">
    <div class="frame-row">
      <img class="frame-item clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame1.png" onclick="selectFrame(1)" alt="frame1">
      <img class="frame-item clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame2.png" onclick="selectFrame(2)" alt="frame2">
      <img class="frame-item clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame3.png" onclick="selectFrame(3)" alt="frame3">
      <img class="frame-item clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame4.png" onclick="selectFrame(4)" alt="frame4">
      <img class="frame-item clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame5.png" onclick="selectFrame(5)" alt="frame5">
    </div>
  </div>

  <!-- 4. 確認樣式 -->
  <div id="screen-confirm" class="screen">
    <img class="bg-layer" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/menu.png" alt="menu bg">
    <img id="confirm-overlay-img" class="bg-layer" src="" alt="confirm frame">
    <img class="btn-no clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/no.png" onclick="resetToMenu()" alt="no">
    <img class="btn-yes clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/yes.png" onclick="goToModeSelect()" alt="yes">
  </div>

  <!-- 5. 模式選擇 -->
  <div id="screen-mode" class="screen bg-cover" style="background-image: url('https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/mode.png');">
    <img class="btn-album clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Album_open.png" onclick="triggerPhotoUpload()" alt="相片">
    <img class="btn-camera clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Camera_open.png" onclick="startCameraMode()" alt="拍照">
  </div>

  <!-- 6. 拍照畫面 -->
  <div id="screen-shot" class="screen">
    <video id="shot-camera-video" autoplay playsinline muted></video>
    <img id="shot-overlay" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Shot1.png" alt="shot overlay">
    <div id="countdown-text"></div>
  </div>

  <!-- 7. OK 畫面 -->
  <div id="screen-ok" class="screen">
    <img id="ok-overlay" class="bg-layer" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Ok1.png" alt="ok">
  </div>

  <!-- 8. Loading -->
  <div id="screen-loading" class="screen bg-cover" style="background-image: url('https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/loading.png');"></div>

  <!-- 9. 完成下載頁面 -->
  <div id="screen-thanks" class="screen">
    <div class="thanks-wrapper">
      <img id="final-canvas-preview" src="" alt="Photobooth Final Output">
      <div class="action-buttons">
        <img class="action-btn clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Again.png" onclick="resetApp()" alt="再試一次">
        <img class="action-btn clickable" src="https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Download.png" onclick="downloadPhoto()" alt="下載照片">
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" multiple onchange="handleFileSelect(event)">
<canvas id="hidden-canvas"></canvas>

<script>
  const ASSETS = {
    hello: [
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/hello1.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/hello2.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/hello3.png'
    ],
    flashlight: [
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/flashlight1.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/flashlight2.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/flashlight3.png'
    ],
    frames: {
      1: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame1.png',
      2: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame2.png',
      3: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame3.png',
      4: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame4.png',
      5: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/frame5.png'
    },
    confirms: {
      1: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/confirm1.png',
      2: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/confirm2.png',
      3: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/confirm3.png',
      4: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/confirm4.png',
      5: 'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/confirm5.png'
    },
    shots: [
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Shot1.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Shot2.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Shot3.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Shot4.png'
    ],
    oks: [
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Ok1.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Ok2.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Ok3.png',
      'https://raw.githubusercontent.com/10yyh04-lab/photobooth-assets/refs/heads/main/Ok4.png'
    ]
  };

  /* 
     精準對齊比例：
     根據標準 4 格條狀拍貼機相框，4 個孔洞在整張圖上的相對位置 (%):
     X: 13.5% (寬度 73%)
     Y 分別位於: 12%, 29.5%, 47%, 64.5% (高度約 15.5%)
  */
  const SLOT_PERCENT = [
    { x: 0.135, y: 0.120, w: 0.73, h: 0.155 },
    { x: 0.135, y: 0.295, w: 0.73, h: 0.155 },
    { x: 0.135, y: 0.470, w: 0.73, h: 0.155 },
    { x: 0.135, y: 0.645, w: 0.73, h: 0.155 }
  ];

  let currentHelloStep = 1;
  let selectedFrameIndex = 1;
  let userImages = [];
  let cameraStream = null;
  let currentShotCount = 0;

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(screenId);
    if (target) target.classList.add('active');
  }

  document.addEventListener('DOMContentLoaded', () => {
    initApp();
  });

  function initApp() {
    currentHelloStep = 1;
    selectedFrameIndex = 1;
    userImages = [];
    currentShotCount = 0;

    const helloImg = document.getElementById('hello-img');
    if (helloImg) {
      helloImg.src = ASSETS.hello[0];
      helloImg.style.display = 'none';
      setTimeout(() => { helloImg.style.display = 'block'; }, 500);

      helloImg.onclick = () => {
        if (currentHelloStep < 3) {
          currentHelloStep++;
          helloImg.src = ASSETS.hello[currentHelloStep - 1];
        } else if (currentHelloStep === 3) {
          currentHelloStep++;
          helloImg.style.display = 'none';
          runFlashlightSequence(() => {
            showScreen('screen-choose');
          });
        }
      };
    }

    document.getElementById('btn-to-menu').onclick = () => showScreen('screen-menu');
  }

  function runFlashlightSequence(callback) {
    const flashEl = document.getElementById('flashlight');
    let flashIdx = 0;
    flashEl.style.display = 'block';

    const interval = setInterval(() => {
      if (flashIdx < 3) {
        flashEl.src = ASSETS.flashlight[flashIdx];
        flashIdx++;
      } else {
        clearInterval(interval);
        flashEl.style.display = 'none';
        if (callback) callback();
      }
    }, 250);
  }

  function selectFrame(index) {
    selectedFrameIndex = index;
    document.getElementById('confirm-overlay-img').src = ASSETS.confirms[index];
    showScreen('screen-confirm');
  }

  function resetToMenu() { showScreen('screen-menu'); }
  function goToModeSelect() { showScreen('screen-mode'); }
  function triggerPhotoUpload() { document.getElementById('file-input').click(); }

  /* 選擇照片 */
  function handleFileSelect(event) {
    const files = event.target.files;
    if (!files || files.length < 4) {
      alert('請選取 4 張照片喔！');
      return;
    }

    userImages = [];
    let loadedCount = 0;

    for (let i = 0; i < 4; i++) {
      const img = new Image();
      img.onload = () => {
        loadedCount++;
        if (loadedCount === 4) processAndGenerateFinal();
      };
      img.src = URL.createObjectURL(files[i]);
      userImages.push(img);
    }
  }

  /* 相機模式 */
  async function startCameraMode() {
    userImages = [];
    currentShotCount = 0;

    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });

      const video = document.getElementById('shot-camera-video');
      video.srcObject = cameraStream;

      runShotSequence();
    } catch (err) {
      alert("無法取得相機權限，請確認瀏覽器相機權限已開啟！");
      console.error(err);
    }
  }

  /* 循環 Shot1 -> 拍照 -> Ok1 -> Shot2 ... */
  function runShotSequence() {
    if (currentShotCount >= 4) {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      processAndGenerateFinal();
      return;
    }

    showScreen('screen-shot');
    document.getElementById('shot-overlay').src = ASSETS.shots[currentShotCount];

    let countdown = 3;
    const countEl = document.getElementById('countdown-text');
    countEl.innerText = countdown;

    const timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        countEl.innerText = countdown;
      } else {
        clearInterval(timer);
        countEl.innerText = "";

        captureCurrentFrame();

        document.getElementById('ok-overlay').src = ASSETS.oks[currentShotCount];
        showScreen('screen-ok');

        setTimeout(() => {
          currentShotCount++;
          runShotSequence();
        }, 1200);
      }
    }, 1000);
  }

  /* 擷取鏡頭 */
  function captureCurrentFrame() {
    const video = document.getElementById('shot-camera-video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');

    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const img = new Image();
    img.src = canvas.toDataURL('image/png');
    userImages.push(img);
  }

  /* 合成海報 */
  function processAndGenerateFinal() {
    showScreen('screen-loading');

    const canvas = document.getElementById('hidden-canvas');
    const ctx = canvas.getContext('2d');

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    loadImage(ASSETS.frames[selectedFrameIndex]).then((frameImg) => {
      if (!frameImg) {
        alert("相框圖載入失敗");
        return;
      }

      // 以相框原圖尺寸建立 Canvas，保證 100% 不變形
      canvas.width = frameImg.width;
      canvas.height = frameImg.height;

      const CW = canvas.width;
      const CH = canvas.height;

      // 1. 純白底色
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CW, CH);

      // 2. 渲染 4 張相片至對應視窗
      userImages.forEach((img, i) => {
        if (i < 4 && img && SLOT_PERCENT[i]) {
          const slot = SLOT_PERCENT[i];

          // 加上 +2% Bleed 外擴邊界，防止白縫
          const dx = (slot.x - 0.01) * CW;
          const dy = (slot.y - 0.01) * CH;
          const dw = (slot.w + 0.02) * CW;
          const dh = (slot.h + 0.02) * CH;

          const targetRatio = dw / dh;
          let sw = img.width;
          let sh = img.height;
          let sx = 0;
          let sy = 0;

          if (sw / sh > targetRatio) {
            sw = sh * targetRatio;
            sx = (img.width - sw) / 2;
          } else {
            sh = sw / targetRatio;
            sy = (img.height - sh) / 2;
          }

          ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
        }
      });

      // 3. 最上層蓋上相框
      ctx.drawImage(frameImg, 0, 0, CW, CH);

      setTimeout(() => {
        const finalUrl = canvas.toDataURL('image/png');
        document.getElementById('final-canvas-preview').src = finalUrl;
        showScreen('screen-thanks');
      }, 400);
    });
  }

  function downloadPhoto() {
    const canvas = document.getElementById('hidden-canvas');
    const link = document.createElement('a');
    link.download = `photobooth_${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function resetApp() {
    showScreen('screen-intro');
    initApp();
  }
</script>

</body>
</html>
